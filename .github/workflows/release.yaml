name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  release:
    name: Release
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: rules_elisp-*.tar.gz
      prerelease: false
      draft: true
